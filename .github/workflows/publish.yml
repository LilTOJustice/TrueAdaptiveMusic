name: Publish on GitHub, CurseForge & Modrinth

on:
  push:
    branches:
      - '*.*'
  workflow_dispatch:

env:
  MINECRAFT_VERSION: "${{ github.ref_name }}"
  JAVA_VERSION: 17
  VERSION: '1.1'
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
  
permissions:
  contents: write
  
jobs:
  build:
    if: contains(github.ref_name, '.') # Is version branch
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env
        
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
          
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: 17
          
      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
        
      - name: Build
        run: ./gradlew clean build
        
      - name: Publish (CurseForge/Modrinth/GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: true-adaptive-music
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"
          
          modrinth-id: UeDAoEyD
          modrinth-token: "${{env.MODRINTH_TOKEN}}"
          
          github-tag: "v${{env.VERSION}}+${{env.MINECRAFT_VERSION}}"
          github-token: "${{env.GITHUB_TOKEN}}"
          
          name: "TrueAdaptiveMusic ${{env.VERSION}} for Minecraft ${{env.MINECRAFT_VERSION}}"
          version: "${{env.VERSION}}+${{env.MINECRAFT_VERSION}}"
          version-type: release
          changelog-file: CHANGELOG.md
          
          loaders: fabric
          game-versions: "${{env.MINECRAFT_VERSION}}"
          java: "${{env.JAVA_VERSION}}"
