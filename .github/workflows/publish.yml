name: Publish mod

on:
  push:
    branches:
      - 'versions/*.*'
      - '!versions/*-update-*'
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
  
permissions:
  contents: write
  
jobs:
  determine-versions:
    runs-on: ubuntu-latest
    outputs:
      MINECRAFT_VERSION: ${{ steps.minecraft.outputs.test }}
      MOD_VERSION: ${{ steps.mod.outputs.test }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
      - id: minecraft
        name: Get minecraft version
        run: |
          grep -oP 'minecraft_version=\K.*' gradle.properties >> "$GITHUB_OUTPUT"
      - id: mod
        name: Get mod version
        run: |
          grep -oP 'mod_version=\K.*' gradle.properties >> "$GITHUB_OUTPUT"
  build:
    if: contains(github.ref_name, 'versions/') # Is version branch
    runs-on: ubuntu-latest
    needs: determine-versions
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: 21

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish (CurseForge/Modrinth/GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: true-adaptive-music
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"
          
          modrinth-id: UeDAoEyD
          modrinth-token: "${{env.MODRINTH_TOKEN}}"
          
          name: "TrueAdaptiveMusic ${{ needs.determine_versions.outputs.mod_version }} for Minecraft ${{ needs.determine_versions.outputs.minecraft_version}}"
          version: "${{ needs.determine_versions.outputs.mod_version }}+${{ needs.determine_version.outputs.minecraft_version }}"
          version-type: release
          changelog-file: CHANGELOG.md
          
          loaders: fabric
          game-versions: "${{ needs.determine_versions.outputs.minecraft_version }}"
          java: "${{env.JAVA_VERSION}}"
