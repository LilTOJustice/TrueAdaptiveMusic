name: Publish mod

on:
  push:
    branches:
      - 'versions/*.*'
      - '!versions/*-update-*'
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  MODRINTH_ID: UeDAoEyD
  CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}
  CURSEFORGE_ID: true-adaptive-music
  VERSION_TYPE: release
  CHANGELOG_FILE: CHANGELOG.md

permissions:
  contents: write
  
jobs:
  determine-versions:
    runs-on: ubuntu-latest
    outputs:
      minecraft_version: ${{ steps.minecraft.outputs.minecraft_version }}
      mod_version: ${{ steps.mod.outputs.mod_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
      - id: minecraft
        name: Get minecraft version
        run: |
          grep 'minecraft_version=.*' gradle.properties >> "$GITHUB_OUTPUT"
      - id: mod
        name: Get mod version
        run: |
          grep 'mod_version=.*' gradle.properties >> "$GITHUB_OUTPUT"
  build-and-publish:
    if: contains(github.ref_name, 'versions/') # Is version branch
    runs-on: ubuntu-latest
    needs: determine-versions
    steps:
      - name: Check Environment Variables
        run: env
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          server-username: ${{ env.CENTRAL_USERNAME }}
          server-password: ${{ env.CENTRAL_PASSWORD }}
          gpg-private-key: ${{ env.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ env.GPG_PASSPHRASE }}
      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      # Non-CurseForge
      - name: Build
        run: ./gradlew clean build

      - name: Publish Fabric
        env:
          MINECRAFT_VERSION: ${{needs.determine-versions.outputs.minecraft_version}}
          MOD_VERSION: ${{needs.determine-versions.outputs.mod_version}}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/fabric/libs/!(*-@(dev|sources|javadoc)).jar

          modrinth-id: "${{env.MODRINTH_ID}}"
          modrinth-token: "${{env.MODRINTH_TOKEN}}"

          name: "True Adaptive Music ${{env.MOD_VERSION}} for Minecraft Fabric ${{env.MINECRAFT_VERSION}}"
          version: "${{env.MOD_VERSION}}+${{env.MINECRAFT_VERSION}}"
          version-type: "${{env.VERSION_TYPE}}"
          changelog-file: "${{env.CHANGELOG_FILE}}"
          java: "${{env.JAVA_VERSION}}"
      - name: Publish NeoForge
        env:
          MINECRAFT_VERSION: ${{needs.determine-versions.outputs.minecraft_version}}
          MOD_VERSION: ${{needs.determine-versions.outputs.mod_version}}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/neoforge/libs/!(*-@(dev|sources|javadoc)).jar

          modrinth-id: "${{env.MODRINTH_ID}}"
          modrinth-token: "${{env.MODRINTH_TOKEN}}"

          name: "True Adaptive Music ${{env.MOD_VERSION}} for Minecraft Neoforge ${{env.MINECRAFT_VERSION}}"
          version: "${{env.MOD_VERSION}}+${{env.MINECRAFT_VERSION}}"
          version-type: "${{env.VERSION_TYPE}}"
          changelog-file: "${{env.CHANGELOG_FILE}}"
          java: "${{env.JAVA_VERSION}}"
          dependencies: |
            kotlin-for-forge(required)

      # CurseForge
      - name: Build (CurseForge)
        run: ./gradlew clean build -Pis_curseforge=true

      - name: Publish Fabric (CurseForge)
        env:
          MINECRAFT_VERSION: ${{needs.determine-versions.outputs.minecraft_version}}
          MOD_VERSION: ${{needs.determine-versions.outputs.mod_version}}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/fabric/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: "${{env.CURSEFORGE_ID}}"
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"

          name: "True Adaptive Music ${{env.MOD_VERSION}} for Minecraft Fabric ${{env.MINECRAFT_VERSION}}"
          version: "${{env.MOD_VERSION}}+${{env.MINECRAFT_VERSION}}"
          version-type: "${{env.VERSION_TYPE}}"
          changelog-file: "${{env.CHANGELOG_FILE}}"
          java: "${{env.JAVA_VERSION}}"
      - name: Publish NeoForge (CurseForge)
        env:
          MINECRAFT_VERSION: ${{needs.determine-versions.outputs.minecraft_version}}
          MOD_VERSION: ${{needs.determine-versions.outputs.mod_version}}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/neoforge/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: "${{env.CURSEFORGE_ID}}"
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"

          name: "True Adaptive Music ${{env.MOD_VERSION}} for Minecraft Neoforge ${{env.MINECRAFT_VERSION}}"
          version: "${{env.MOD_VERSION}}+${{env.MINECRAFT_VERSION}}"
          version-type: "${{env.VERSION_TYPE}}"
          changelog-file: "${{env.CHANGELOG_FILE}}"
          java: "${{env.JAVA_VERSION}}"
          dependencies: |
            kotlin-for-forge(required)

