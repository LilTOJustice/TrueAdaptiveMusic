modLoader = "klf"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_home}"
iconFile = "${mod_icon}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "trueadaptivemusicapi"
type = "incompatible"
versionRange = "(,1.4.0)"
ordering = "NONE"
side = "BOTH"
reason = "Please remove the True Adaptive Music API mod. It is now included with the base mod."

[[mixins]]
config="META-INF/trueadaptivemusic.mixins.json"
