plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
}

var isCurseForge = is_curseforge == "true"
sourceSets {
    main {
        java {
            srcDirs += "../common/src/main/java"
            srcDirs += "../common/src/client/java"

            if (!isCurseForge) {
                srcDirs += "../extensions/src/main/java"
            }
        }
        kotlin {
            srcDirs += "../common/src/main/kotlin"
            srcDirs += "../common/src/client/kotlin"

            if (!isCurseForge) {
                srcDirs += "../extensions/src/main/kotlin"
            }
        }
        resources {
            srcDirs += "../common/src/main/resources"
            srcDirs += "../common/src/client/resources"

            if (!isCurseForge) {
                srcDirs += "../extensions/src/main/resources"
            }
        }
    }
}

version = mod_version + '+' + minecraft_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

base {
    archivesName = archives_base_name + "-neoforge" + (isCurseForge ? "-curseforge" : "")
}

var javaVersion = java_version.toInteger()
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
kotlin.jvmToolchain(javaVersion)

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation 'thedarkcolour:kotlinforforge-neoforge:' + forge_kotlin_version
    api 'curse.maven:trueadaptivemusicapi-1514598:8492638'
    jarJar 'curse.maven:trueadaptivemusicapi-1514598:8492638'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version              : minecraft_version,
                             minecraft_version_range        : minecraft_version_range,
                             neo_version                    : neoforge_version,
                             neo_version_range              : neoforge_version_range,
                             loader_version_range           : neoforge_loader_version_range,
                             mod_license                    : mod_license,
                             mod_issues                     : mod_issues,
                             mod_id                         : mod_id,
                             mod_version                    : mod_version,
                             mod_name                       : mod_name,
                             mod_home                       : mod_home,
                             mod_icon                       : mod_icon,
                             mod_authors                    : mod_authors,
                             mod_description                : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named("createMinecraftArtifacts") {
    dependsOn "generateModMetadata"
}
