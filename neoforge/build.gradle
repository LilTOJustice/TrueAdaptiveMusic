plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
}

sourceSets {
    main {
        java {
            srcDirs += "../common/src/main/java"
            srcDirs += "../common/src/client/java"
        }
        kotlin {
            srcDirs += "../common/src/main/kotlin"
            srcDirs += "../common/src/client/kotlin"
        }
        resources {
            srcDirs += "../common/src/main/resources"
            srcDirs += "../common/src/client/resources"
        }
    }
}

version = mod_version + '+' + minecraft_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
}

base {
    archivesName = archives_base_name + "-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin.jvmToolchain(25)

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', mod_id as String, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation 'thedarkcolour:kotlinforforge-neoforge:' + forge_kotlin_version
    api files("../TrueAdaptiveMusicAPI-neoforge-1.3.0+26.1.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version              : minecraft_version,
                             minecraft_version_range        : minecraft_version_range,
                             tam_api_version_range          : tam_api_version_range,
                             tam_extensions_version_range   : tam_extensions_version_range,
                             neo_version                    : neoforge_version,
                             neo_version_range              : neoforge_version_range,
                             loader_version_range           : neoforge_loader_version_range,
                             mod_license                    : mod_license,
                             mod_issues                     : mod_issues,
                             mod_id                         : mod_id,
                             mod_version                    : mod_version,
                             mod_name                       : mod_name,
                             mod_home                       : mod_home,
                             mod_icon                       : mod_icon,
                             mod_authors                    : mod_authors,
                             mod_description                : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named("createMinecraftArtifacts") {
    dependsOn "generateModMetadata"
}
